<!doctype html><meta charset="utf-8">
<body style="font:14px system-ui;max-width:700px;margin:20px">
<h3>Daily Tracker settings (JSON)</h3>
<p>Preset: <select id="p"><option value="general">General (LeetCode, GitHub, Study, Assignments)</option><option value="exam-prep">Exam prep (Academics, Exam prep, Project, Paper, LeetCode, Aptitude, Concept)</option></select>
<button id="l">Load preset</button> <small>(keeps your webhook; click Save to apply)</small></p>
<p>Task fields: <b>mode</b> "auto" (counts on the sites in <b>urls</b>) or "manual" (Start/Stop). <b>targetMin</b> = minutes. Set <b>noLink</b>: true to hide the link box.</p>
<textarea id="c" style="width:100%;height:420px;font-family:monospace"></textarea><br>
<button id="s">Save</button> <span id="m"></span>
<script src="options.js"></script>
